name: Deploy demos to Pages

# Builds the landing page + every demo into one site:
#   /ai-visualized/              landing/index.html
#   /ai-visualized/transformer/  demos/transformer-attention
#   /ai-visualized/embeddings/   demos/embeddings
#   /ai-visualized/skipgram/     demos/skipgram
#   /ai-visualized/word2vec/     demos/word2vec
#   /ai-visualized/prompt-injection/  demos/prompt-injection
#   /ai-visualized/rag-ranking/  demos/rag-ranking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build transformer demo
        run: npm run build --workspace @ai-visualized/transformer-attention
        env:
          VITE_BASE: /ai-visualized/transformer/

      - name: Build embeddings demo
        run: npm run build --workspace @ai-visualized/embeddings
        env:
          VITE_BASE: /ai-visualized/embeddings/

      - name: Build skip-gram demo
        run: npm run build --workspace @ai-visualized/skipgram
        env:
          VITE_BASE: /ai-visualized/skipgram/

      - name: Build word2vec demo
        run: npm run build --workspace @ai-visualized/word2vec
        env:
          VITE_BASE: /ai-visualized/word2vec/

      - name: Build prompt-injection demo
        run: npm run build --workspace @ai-visualized/prompt-injection
        env:
          VITE_BASE: /ai-visualized/prompt-injection/

      - name: Build rag-ranking demo
        run: npm run build --workspace @ai-visualized/rag-ranking
        env:
          VITE_BASE: /ai-visualized/rag-ranking/

      - name: Assemble site
        run: |
          mkdir -p site/transformer site/embeddings site/skipgram site/word2vec site/prompt-injection site/rag-ranking
          cp landing/index.html site/index.html
          cp -r demos/transformer-attention/dist/* site/transformer/
          cp -r demos/embeddings/dist/* site/embeddings/
          cp -r demos/skipgram/dist/* site/skipgram/
          cp -r demos/word2vec/dist/* site/word2vec/
          cp -r demos/prompt-injection/dist/* site/prompt-injection/
          cp -r demos/rag-ranking/dist/* site/rag-ranking/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
